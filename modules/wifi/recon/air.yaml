description: |-
  Базовая команда для сбора данных с помощью airodump-ng
  
  Сохранит pcap и csv в директорию запуска
author: vinzekatze
tags:
  - airodump-ng

arguments:
  i:
    description: имя интерфейса
    replacer: '#interface#'
    metavar: INTERFACE
  c:
    default:
      -
    description: номера каналов для прослушивания (может принимать файлы со списками)
    metavar: CHANNEL
    multiple: true
    regex: '\d+'
  o:
    default: recon
    description: префикс выходных файлов
    metavar: FILE
  b:
    default:
      -
    description: фильтровать точки доступа по BSSID (может принимать файлы со списками)
    multiple: true
    metavar: BSSID
    replacer: '#BSSID#'
    regex: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$|^[0-9A-Fa-f]{12}$'
  p:
    default:
      -
    description: фильтровать по минимальной мощности сигнала
    metavar: POWER
    replacer: '#POWER#'
    regex: '-\d+'
  f: 
    default:
      -
    description: время перечлючения между каналами (ms)
    metavar: 'MS'
    replacer: '#SPEED#'
    regex: '\d+'
  

mode:
  readfile:
    - c
    - b
  format:
    i: '{!r}'
    o: '{!r}'
    b: '--bssid {!r}'
    p: '--min-power {!r}'
    f: '-f {}'
  join:
    c: ','
  pformat:
    c: '--channel {!r}'

shell: bash
script: >-
  interface=#interface#;
  iw dev $interface info 2>&1 1>/dev/null || { echo "Device $interface not found"; exit ; };
  sudo nmcli dev set $interface managed no; sleep 1;
  sudo ip link set $interface down;
  sudo iw $interface set monitor control;
  sudo ip link set $interface up;
  sudo airodump-ng $interface --output-format pcap,csv #c# --band abg --write #o# --wps #BSSID# #POWER# #SPEED#; 