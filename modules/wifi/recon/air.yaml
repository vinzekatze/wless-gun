description: |-
  Базовая команда для сбора данных с помощью airodump-ng
  
  Сохранит pcap и csv в директорию запуска
author: vinzekatze
tags:
  - airodump-ng

arguments:
  interface:
    description: имя интерфейса
  c:
    default:
      -
    description: номера каналов для прослушивания через запятую
    metavar: CHANNEL
  o:
    default: recon
    description: префикс выходных файлов
    metavar: FILE
  b:
    default:
      -
    description: фильтровать точки доступа по BSSID
    multiple: true
    metavar: BSSID
    replacer: '#BSSID#'
  e:
    default:
      -
    description: фильтровать точки доступа по ESSID
    multiple: true
    metavar: ESSID
    replacer: '#ESSID#'

mode:
  format:
    interface: '{!r}'
    o: '{!r}'
    c: '--channel {!r}'
    b: '--bssid {!r}'
    e: '--essid {!r}'

shell: bash
script: >-
  interface=#interface#;
  iw dev $interface info 2>&1 1>/dev/null || { echo "Device $interface not found"; exit ; };
  sudo nmcli dev set $interface managed no; sleep 1;
  sudo ip link set $interface down;
  sudo iw $interface set monitor control;
  sudo ip link set $interface up;
  sudo airodump-ng $interface --output-format pcap,csv #c# --band abg --write #o# --wps #BSSID# #ESSID#; 